<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>瓶出し記録 ビューアー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f7f8fa;
  --border:#d8dce4;--border2:#b8bfcc;
  --text:#1a1d24;--muted:#7a8299;
  --accent:#3355ff;--accent-light:#eef1ff;
  --green:#0b8f5e;--green-light:#e6f7f1;
  --amber:#b06000;--amber-light:#fff4e0;
  --red:#cc2200;--red-light:#fff0ee;
  --violet:#7700cc;--violet-light:#f5eeff;
  --mono:'Share Tech Mono',monospace;
  --sans:'Zen Kaku Gothic New',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100dvh}

/* NAV */
.hdr{
  position:sticky;top:0;z-index:100;
  background:var(--accent);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(51,85,255,.25);
}
.hdr h1{font-size:.95rem;font-weight:900;color:#fff;letter-spacing:.06em}
.hdr .sub{font-size:.6rem;color:rgba(255,255,255,.7);font-family:var(--mono);margin-top:2px}
.hbtn{
  font-family:var(--mono);font-size:.68rem;padding:6px 11px;border-radius:6px;
  border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;
  cursor:pointer;transition:background .15s;text-decoration:none;display:inline-block;
}
.hbtn:hover{background:rgba(255,255,255,.28)}

/* TABS */
.tabs{
  display:flex;overflow-x:auto;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 12px;gap:0;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:12px 16px;font-size:.82rem;font-weight:700;
  color:var(--muted);cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all .15s;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* TOOLBAR */
.toolbar{
  padding:12px 14px;background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.search-wrap{
  flex:1;min-width:180px;
  display:flex;align-items:center;gap:8px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;
}
.search-wrap input{
  flex:1;background:none;border:none;outline:none;
  font-size:.88rem;color:var(--text);font-family:var(--sans);
}
.search-wrap input::placeholder{color:var(--muted)}
.filter-btn{
  font-family:var(--mono);font-size:.68rem;padding:8px 12px;
  border-radius:8px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);cursor:pointer;
  white-space:nowrap;transition:all .15s;
}
.filter-btn.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

/* SORT BAR */
.sort-bar{
  padding:8px 14px;background:var(--surface2);
  border-bottom:1px solid var(--border);
  display:flex;gap:6px;align-items:center;
  font-family:var(--mono);font-size:.62rem;color:var(--muted);
}
.sort-chip{
  padding:3px 10px;border-radius:4px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;transition:all .15s;color:var(--muted);
}
.sort-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* CARDS */
.list{padding:12px;display:flex;flex-direction:column;gap:10px}

.record-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
  animation:fadeUp .2s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card-hd{
  background:var(--accent-light);padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--border);
}
.card-lot{font-family:var(--mono);font-size:.85rem;font-weight:700;color:var(--accent)}
.card-right{display:flex;align-items:center;gap:8px}
.card-tot{font-family:var(--mono);font-size:.6rem;color:var(--muted)}
.edit-btn{
  font-family:var(--mono);font-size:.6rem;padding:3px 8px;
  border:1px solid var(--border2);border-radius:5px;
  background:var(--surface);color:var(--muted);cursor:pointer;
  transition:all .15s;
}
.edit-btn:hover{border-color:var(--accent);color:var(--accent)}
.del-btn{
  font-family:var(--mono);font-size:.6rem;padding:3px 8px;
  border:1px solid rgba(204,34,0,.3);border-radius:5px;
  background:var(--red-light);color:var(--red);cursor:pointer;
  transition:all .15s;
}
.del-btn:hover{background:var(--red);color:#fff}

.card-meta{
  padding:7px 14px;background:var(--surface2);
  border-bottom:1px solid var(--border);
  font-size:.62rem;color:var(--muted);
  display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);
}
.card-meta span{color:var(--text);font-weight:700}

.data-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:6px;padding:10px 12px;
}
.data-cell{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:6px 8px;text-align:center;
}
.data-cell .dl{font-size:.46rem;color:var(--muted);font-family:var(--mono);margin-bottom:2px}
.data-cell .dv{font-family:var(--mono);font-size:.82rem;font-weight:700}
.data-cell.loss-row{grid-column:span 3;display:flex;gap:6px;background:none;border:none;padding:4px 12px 10px}
.loss-mini{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;text-align:center}

.carry-bar{
  padding:7px 14px;background:var(--violet-light);
  font-family:var(--mono);font-size:.62rem;color:var(--violet);
}
.carry-bar b{color:var(--text)}

.c-violet{color:var(--violet)}
.c-blue{color:var(--accent)}
.c-amber{color:var(--amber)}
.c-red{color:var(--red)}
.c-green{color:var(--green)}

/* EMPTY / LOADING */
.center-msg{
  text-align:center;padding:60px 20px;
  color:var(--muted);font-family:var(--mono);font-size:.82rem;
}
.spinner{
  width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:200;display:flex;align-items:flex-end;
  padding:0;
}
.modal-bg.hidden{display:none}
.modal{
  background:var(--surface);border-radius:20px 20px 0 0;
  width:100%;max-height:85vh;overflow-y:auto;
  box-shadow:0 -8px 32px rgba(0,0,0,.2);
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-hd{
  background:var(--accent);color:#fff;padding:14px 16px;
  font-weight:700;font-size:.9rem;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:1;
}
.modal-close{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;line-height:1}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.mfield{display:flex;flex-direction:column;gap:4px}
.mfield label{font-size:.68rem;color:var(--muted);font-family:var(--mono);font-weight:700;letter-spacing:.06em}
.mfield input,.mfield textarea{
  background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;
  padding:10px 12px;font-family:var(--sans);font-size:.9rem;color:var(--text);
  outline:none;transition:border-color .15s;width:100%;
}
.mfield input:focus,.mfield textarea:focus{border-color:var(--accent)}
.mfield input[type=number]{-moz-appearance:textfield}
.mfield input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.msave{
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:13px;font-size:.9rem;font-weight:900;cursor:pointer;
  font-family:var(--sans);transition:opacity .15s;
}
.msave:active{opacity:.8}

/* SETTINGS */
.settings-panel{
  padding:16px;display:flex;flex-direction:column;gap:12px;
}
.settings-panel .panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
}
.panel-hd{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
  padding:8px 14px;background:var(--surface2);
  border-bottom:1px solid var(--border);
}
.settings-panel input[type=text]{
  width:100%;background:none;border:none;
  font-family:var(--mono);font-size:.78rem;color:var(--text);
  padding:12px 14px;outline:none;
}
.save-url-btn{
  background:var(--accent);color:#fff;border:none;
  border-radius:8px;padding:12px;font-size:.88rem;font-weight:700;
  cursor:pointer;width:100%;font-family:var(--sans);
}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:24px;
  transform:translateX(-50%) translateY(20px);
  background:var(--text);color:#fff;
  border-radius:9px;padding:10px 18px;
  font-family:var(--mono);font-size:.72rem;
  z-index:500;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
  box-shadow:0 6px 24px rgba(0,0,0,.2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>瓶出し記録 ビューアー</h1>
    <div class="sub" id="hdrSub">// データを読み込み中...</div>
  </div>
  <button class="hbtn" onclick="showSettings()">設定</button>
</div>

<!-- TABS -->
<div class="tabs" id="tabs"></div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <span style="color:var(--muted)">🔍</span>
    <input type="text" id="searchInput" placeholder="LOT No.・担当者・PL No.で検索..." oninput="applyFilter()">
  </div>
  <button class="filter-btn" id="filterLoss" onclick="toggleFilter('loss')">ロスあり</button>
  <button class="filter-btn" id="filterToday" onclick="toggleFilter('today')">今日</button>
</div>

<!-- SORT BAR -->
<div class="sort-bar">
  <span>並び順:</span>
  <div class="sort-chip active" id="sort-date" onclick="setSort('date')">新しい順</div>
  <div class="sort-chip" id="sort-lot" onclick="setSort('lot')">LOT順</div>
  <div class="sort-chip" id="sort-pk" onclick="setSort('pk')">PK数</div>
</div>

<!-- LIST -->
<div id="mainContent">
  <div class="center-msg"><div class="spinner"></div>データを読み込んでいます...</div>
</div>

<!-- 編集モーダル -->
<div class="modal-bg hidden" id="editModal">
  <div class="modal">
    <div class="modal-hd">
      <span id="editTitle">記録を編集</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="mfield"><label>PL No.</label><input type="text" id="e_plno"></div>
      <div class="mfield"><label>瓶ロット（NT-以降）</label><input type="text" id="e_bottlelot" placeholder="番号のみ"></div>
      <div class="mfield"><label>LOT No.</label><input type="text" id="e_lotno"></div>
      <div class="mfield"><label>前端数</label><input type="number" id="e_prev" min="0"></div>
      <div class="mfield"><label>製造予定数量</label><input type="number" id="e_qty" min="0"></div>
      <div class="mfield"><label>ロス</label><input type="number" id="e_loss" min="0"></div>
      <div class="mfield"><label>担当者名</label><input type="text" id="e_name"></div>
      <div class="mfield"><label>備考</label><input type="text" id="e_memo"></div>
      <button class="msave" onclick="saveEdit()">保存する</button>
    </div>
  </div>
</div>

<!-- 設定モーダル -->
<div class="modal-bg hidden" id="settingsModal">
  <div class="modal">
    <div class="modal-hd">
      <span>設定</span>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="settings-panel">
      <div class="panel">
        <div class="panel-hd">// GAS URL</div>
        <input type="text" id="gasUrlSetting" placeholder="GASのウェブアプリURLを貼り付け">
      </div>
      <button class="save-url-btn" onclick="saveUrl()">URLを保存して再読み込み</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL_DEFAULT = '';
let gasUrl = localStorage.getItem('viewerGasUrl') || GAS_URL_DEFAULT;
let allData = [];
let currentTab = '__all__';
let filters = { loss: false, today: false };
let sortKey = 'date';
let editTarget = null;

/* ── INIT ── */
window.addEventListener('DOMContentLoaded', () => {
  const urlInput = document.getElementById('gasUrlSetting');
  if (urlInput) urlInput.value = gasUrl;
  if (gasUrl) loadData();
  else { showSettings(); document.getElementById('mainContent').innerHTML = '<div class="center-msg">URLを設定してください</div>'; }
});

/* ── DATA LOAD ── */
async function loadData() {
  document.getElementById('mainContent').innerHTML = '<div class="center-msg"><div class="spinner"></div>データを読み込んでいます...</div>';
  try {
    // シート一覧取得
    const sheetsRes = await fetch(`${gasUrl}?action=getSheets`);
    const sheetsData = await sheetsRes.json();
    if (!sheetsData.ok) throw new Error(sheetsData.error);
    buildTabs(['__all__', ...(sheetsData.sheets || [])]);

    // データ取得
    const dataRes = await fetch(`${gasUrl}?action=getData&sheet=${currentTab}`);
    const data = await dataRes.json();
    if (!data.ok) throw new Error(data.error);
    allData = (data.data || []).filter(r => r && r.timestamp);

    document.getElementById('hdrSub').textContent = `// ${allData.length}件のデータ`;
    renderList();
  } catch(e) {
    document.getElementById('mainContent').innerHTML = `<div class="center-msg">❌ 読み込み失敗<br>${e.message}<br><br><button onclick="loadData()" style="margin-top:12px;padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer">再試行</button></div>`;
  }
}

/* ── TABS ── */
function buildTabs(sheets) {
  const tabsEl = document.getElementById('tabs');
  const labels = { '__all__': '全て' };
  tabsEl.innerHTML = sheets.map(s => `
    <div class="tab ${s===currentTab?'active':''}" onclick="switchTab('${s}')">
      ${labels[s] || s}
    </div>
  `).join('');
}

function switchTab(sheet) {
  currentTab = sheet;
  loadData();
}

/* ── RENDER ── */
function renderList() {
  let data = [...allData];

  // 検索フィルター
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (q) {
    data = data.filter(r =>
      String(r.lotNo||'').toLowerCase().includes(q) ||
      String(r.plNo||'').toLowerCase().includes(q) ||
      String(r.name||'').toLowerCase().includes(q) ||
      String(r.bottleLot||'').toLowerCase().includes(q) ||
      String(r.memo||'').toLowerCase().includes(q) ||
      String(r.bottleType||'').toLowerCase().includes(q)
    );
  }

  // ロスフィルター
  if (filters.loss) data = data.filter(r => r.loss > 0);

  // 今日フィルター
  if (filters.today) {
    const today = new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'/');
    data = data.filter(r => r.timestamp.startsWith(today.replace(/\//g,'/')));
  }

  // ソート
  if (sortKey === 'date') data.sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp));
  else if (sortKey === 'lot') data.sort((a,b) => a.lotNo.localeCompare(b.lotNo));
  else if (sortKey === 'pk') data.sort((a,b) => b.pk-a.pk);

  if (data.length === 0) {
    document.getElementById('mainContent').innerHTML = '<div class="center-msg">該当するデータがありません</div>';
    return;
  }

  const html = data.map(r => renderCard(r)).join('');
  document.getElementById('mainContent').innerHTML = `<div class="list">${html}</div>`;
}

function renderCard(r) {
  // nullガード
  r.qty       = Number(r.qty)       || 0;
  r.prev      = Number(r.prev)      || 0;
  r.loss      = Number(r.loss)      || 0;
  r.pk        = Number(r.pk)        || 0;
  r.post      = Number(r.post)      || 0;
  r.nextP     = Number(r.nextP)     || 0;
  r.returnQty = Number(r.returnQty) || 0;
  r.lotNo     = r.lotNo  || '—';
  r.name      = r.name   || '';
  r.plNo      = r.plNo   || '';
  r.bottleLot = r.bottleLot || '';
  r.memo      = r.memo   || '';
  r.judge     = r.judge  || '';
  r.lotId     = r.lotId  || '';
  r.bottleType = r.bottleType || '';
  r.timestamp = r.timestamp || '';
  const retColor = r.returnQty === 0 ? 'c-green' : 'c-violet';
  const lossColor = r.loss > 0 ? 'c-red' : 'c-muted';
  const total = r.qty + r.loss;

  return `
    <div class="record-card">
      <div class="card-hd">
        <span class="card-lot">LOT_${r.lotNo || '—'}</span>
        <div class="card-right">
          <span class="card-tot">${r.qty.toLocaleString()}本 / ${r.pk}pk</span>
          <button class="edit-btn" onclick='openEdit(${JSON.stringify(r)})'>編集</button>
          <button class="del-btn" onclick="confirmDel('${r.lotId}','${r.bottleType}')">削除</button>
        </div>
      </div>
      <div class="card-meta">
        ${r.plNo ? `PL No.：<span>${r.plNo}</span>` : ''}
        ${r.bottleLot && r.bottleLot!=='NT-' ? `瓶ロット：<span>${r.bottleLot}</span>` : ''}
        ${r.name ? `担当者：<span>${r.name}</span>` : ''}
        ${r.memo ? `備考：<span>${r.memo}</span>` : ''}
        <span style="margin-left:auto;color:var(--muted)">${r.timestamp}</span>
      </div>
      <div style="padding:8px 12px 4px;font-family:var(--mono);font-size:.58rem;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border)">
        瓶種：<strong style="color:var(--text)">${r.bottleType}</strong>
      </div>
      <div class="data-grid">
        <div class="data-cell"><div class="dl">製造予定数量</div><div class="dv">${r.qty.toLocaleString()}</div></div>
        <div class="data-cell"><div class="dl">前端数</div><div class="dv c-violet">${r.prev.toLocaleString()}</div></div>
        <div class="data-cell"><div class="dl">PK数</div><div class="dv c-blue">${r.pk}pk</div></div>
        <div class="data-cell"><div class="dl">後端数</div><div class="dv c-amber">${r.post}本</div></div>
        <div class="data-cell"><div class="dl">次前端数</div><div class="dv c-violet">${r.nextP}本</div></div>
        <div class="data-cell"><div class="dl">戻し本数</div><div class="dv ${retColor}">${r.returnQty}本</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 10px">
        <div class="data-cell"><div class="dl">ロス</div><div class="dv ${lossColor}">${r.loss>0?r.loss+'本':'—'}</div></div>
        <div class="data-cell"><div class="dl">合計</div><div class="dv c-amber">${total.toLocaleString()}本</div></div>
      </div>
      <div class="carry-bar">▸ 次ロット前端数：${r.bottleType} <b>${r.nextP}本</b>　判定：<b>${r.judge}</b></div>
    </div>
  `;
}

/* ── FILTER / SORT ── */
function applyFilter() { renderList(); }

function toggleFilter(key) {
  filters[key] = !filters[key];
  document.getElementById(`filter${key.charAt(0).toUpperCase()+key.slice(1)}`).classList.toggle('active', filters[key]);
  renderList();
}

function setSort(key) {
  sortKey = key;
  document.querySelectorAll('.sort-chip').forEach(el => el.classList.remove('active'));
  document.getElementById(`sort-${key}`).classList.add('active');
  renderList();
}

/* ── EDIT ── */
function openEdit(r) {
  editTarget = r;
  document.getElementById('editTitle').textContent = `LOT_${r.lotNo} を編集`;
  document.getElementById('e_plno').value = r.plNo || '';
  document.getElementById('e_bottlelot').value = (r.bottleLot || '').replace(/^NT-/,'');
  document.getElementById('e_lotno').value = r.lotNo || '';
  document.getElementById('e_prev').value = r.prev || 0;
  document.getElementById('e_qty').value = r.qty || 0;
  document.getElementById('e_loss').value = r.loss || 0;
  document.getElementById('e_name').value = r.name || '';
  document.getElementById('e_memo').value = r.memo || '';
  document.getElementById('editModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('editModal').classList.add('hidden');
  editTarget = null;
}

async function saveEdit() {
  if (!editTarget) return;
  const r = editTarget;
  const newData = {
    plNo:      document.getElementById('e_plno').value.trim(),
    bottleLot: 'NT-' + document.getElementById('e_bottlelot').value.trim(),
    lotNo:     document.getElementById('e_lotno').value.trim(),
    name:      document.getElementById('e_name').value.trim(),
    memo:      document.getElementById('e_memo').value.trim(),
    overwrite: true,
    lotId:     r.lotId,
    rows: [{
      name:      r.bottleType,
      prev:      parseInt(document.getElementById('e_prev').value) || 0,
      qty:       parseInt(document.getElementById('e_qty').value) || 0,
      loss:      parseInt(document.getElementById('e_loss').value) || 0,
      pk:        r.pk,
      post:      r.post,
      nextP:     r.nextP,
      judge:     r.judge,
      returnQty: r.returnQty,
    }]
  };

  showToast('▸ 保存中…', '');
  try {
    const res = await fetch(gasUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(newData)
    });
    const data = await res.json();
    if (data.ok) {
      showToast('✔ 保存しました', 'ok');
      closeModal();
      loadData();
    } else {
      showToast('✕ 保存失敗', 'err');
    }
  } catch(e) {
    showToast('✕ 通信エラー', 'err');
  }
}

/* ── DELETE ── */
async function confirmDel(lotId, bottleType) {
  if (!confirm('このロットの記録を削除しますか？')) return;
  showToast('▸ 削除中…', '');
  try {
    const res = await fetch(`${gasUrl}?action=deleteRow&lotId=${encodeURIComponent(lotId)}&sheet=${encodeURIComponent(bottleType)}`);
    const data = await res.json();
    if (data.ok) {
      showToast('✔ 削除しました', 'ok');
      loadData();
    } else {
      showToast('✕ 削除失敗', 'err');
    }
  } catch(e) {
    showToast('✕ 通信エラー', 'err');
  }
}

/* ── SETTINGS ── */
function showSettings() {
  document.getElementById('gasUrlSetting').value = gasUrl;
  document.getElementById('settingsModal').classList.remove('hidden');
}
function closeSettings() {
  document.getElementById('settingsModal').classList.add('hidden');
}
function saveUrl() {
  const url = document.getElementById('gasUrlSetting').value.trim();
  if (!url) { showToast('URLを入力してください', 'err'); return; }
  gasUrl = url;
  localStorage.setItem('viewerGasUrl', url);
  closeSettings();
  loadData();
}

/* ── TOAST ── */
let toastTimer;
function showToast(msg, cls) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${cls}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2200);
}
</script>
