<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>瓶出し記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #f7f8fa;
  --border: #d8dce4;
  --border2: #b8bfcc;
  --text: #1a1d24;
  --muted: #7a8299;
  --accent: #3355ff;
  --accent-light: #eef1ff;
  --green: #0b8f5e;
  --green-light: #e6f7f1;
  --amber: #b06000;
  --amber-light: #fff4e0;
  --red: #cc2200;
  --red-light: #fff0ee;
  --violet: #7700cc;
  --violet-light: #f5eeff;
  --mono: 'Share Tech Mono', monospace;
  --sans: 'Zen Kaku Gothic New', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100dvh; line-height: 1.4; }

.hdr {
  position: sticky; top: 0; z-index: 100;
  background: var(--accent); padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  box-shadow: 0 2px 8px rgba(51,85,255,.25);
}
.hdr-left h1 { font-size: .95rem; font-weight: 900; letter-spacing: .1em; color: #fff; text-transform: uppercase; }
.hdr-left .sub { font-size: .6rem; color: rgba(255,255,255,.7); font-family: var(--mono); margin-top: 2px; }
.hdr-btns { display: flex; gap: 6px; }
.hbtn {
  font-family: var(--mono); font-size: .68rem; padding: 6px 11px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.15); color: #fff;
  cursor: pointer; transition: background .15s;
}
.hbtn:hover { background: rgba(255,255,255,.28); }

#screen-setup { padding: 16px 12px; display: flex; flex-direction: column; gap: 14px; animation: fadeUp .3s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }

.setup-note {
  font-size: .75rem; color: var(--muted); line-height: 1.7; font-family: var(--mono);
  border-left: 3px solid var(--accent); background: var(--accent-light);
  border-radius: 0 6px 6px 0; padding: 8px 10px;
}
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.panel-hd { font-family: var(--mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 8px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); }

.tog-item { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .1s; }
.tog-item:last-child { border-bottom: none; }
.tog-item:active { background: var(--accent-light); }
.tog-box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: .7rem; transition: all .15s; }
.tog-item.on .tog-box { background: var(--accent); border-color: var(--accent); color: #fff; }
.tog-info { flex: 1; }
.tog-name { font-size: .9rem; font-weight: 700; }
.tog-desc { font-size: .62rem; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
.pk-wrap { display: flex; align-items: center; gap: 5px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; }
.pk-wrap input { width: 46px; background: none; border: none; font-family: var(--mono); font-size: .88rem; font-weight: 700; color: var(--text); text-align: center; outline: none; -moz-appearance: textfield; }
.pk-wrap input::-webkit-inner-spin-button, .pk-wrap input::-webkit-outer-spin-button { -webkit-appearance: none; }
.pk-lbl { font-size: .58rem; color: var(--muted); font-family: var(--mono); }

.custom-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.custom-row input[type=text] { flex: 1; background: none; border: none; border-bottom: 1px solid var(--border); font-size: .88rem; color: var(--text); padding: 3px 2px; outline: none; font-family: var(--sans); transition: border-color .15s; }
.custom-row input[type=text]:focus { border-color: var(--accent); }
.custom-del { background: none; border: none; color: var(--red); font-size: .9rem; cursor: pointer; padding: 4px; }
.add-custom-btn { background: none; border: 1.5px dashed var(--border2); border-radius: 10px; color: var(--muted); font-size: .78rem; padding: 12px; cursor: pointer; width: 100%; font-family: var(--mono); transition: border-color .15s, color .15s; }
.add-custom-btn:hover { border-color: var(--accent); color: var(--accent); }

.gas-row { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
.gas-input { flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; font-family: var(--mono); font-size: .72rem; color: var(--text); padding: 8px 9px; outline: none; transition: border-color .15s; }
.gas-input:focus { border-color: var(--accent); }
.gas-input::placeholder { color: var(--muted); }
.gas-test { font-family: var(--mono); font-size: .66rem; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; white-space: nowrap; transition: border-color .15s, color .15s; }
.gas-test:hover { border-color: var(--accent); color: var(--accent); }
.gas-note { font-family: var(--mono); font-size: .6rem; color: var(--muted); line-height: 1.6; padding: 0 14px 12px; }
.gas-note.ok { color: var(--green); } .gas-note.err { color: var(--red); }

.start-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: .95rem; font-weight: 900; padding: 15px; cursor: pointer; width: 100%; font-family: var(--sans); letter-spacing: .06em; transition: opacity .15s; box-shadow: 0 3px 10px rgba(51,85,255,.35); }
.start-btn:active { opacity: .8; }

#screen-main { display: none; flex-direction: column; gap: 14px; padding: 14px 12px 40px; animation: fadeUp .25s ease; }

.lot-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.lot-field { display: flex; align-items: center; gap: 10px; }
.lot-lbl { font-family: var(--mono); font-size: .62rem; color: var(--muted); letter-spacing: .08em; white-space: nowrap; min-width: 72px; font-weight: 700; }
.lot-prefix { font-family: var(--mono); font-size: .9rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
.lot-input { flex: 1; background: none; border: none; border-bottom: 1.5px solid var(--border); font-family: var(--mono); font-size: .95rem; font-weight: 700; color: var(--text); padding: 3px 2px; outline: none; transition: border-color .2s; min-width: 0; }
.lot-input:focus { border-color: var(--accent); }
.lot-input::placeholder { color: var(--muted); font-weight: 400; font-size: .82rem; }
.lot-divider { height: 1px; background: var(--border); }

/* 備考欄 */
.memo-row { display: flex; align-items: center; gap: 10px; }
.memo-input {
  flex: 1; background: none; border: none;
  border-bottom: 1.5px solid var(--border);
  font-family: var(--sans); font-size: .88rem; font-weight: 400;
  color: var(--text); padding: 3px 2px; outline: none;
  transition: border-color .2s; min-width: 0;
}
.memo-input:focus { border-color: var(--accent); }
.memo-input::placeholder { color: var(--muted); font-size: .82rem; }

.etable { width: 100%; }
.ecols  { grid-template-columns: 48px repeat(5, 1fr); }
.ecols7 { grid-template-columns: 44px repeat(6, 1fr); }
.e-head { display: grid; padding: 7px 10px; background: var(--accent); font-family: var(--mono); font-size: .54rem; letter-spacing: .08em; color: rgba(255,255,255,.85); text-align: center; }
.e-head span:first-child { text-align: left; }
.e-row { display: grid; padding: 9px 10px; gap: 4px; border-bottom: 1px solid var(--border); align-items: center; background: var(--surface); }
.e-row:last-child { border-bottom: none; }
.e-row:nth-child(even) { background: var(--surface2); }
.e-name { font-family: var(--mono); font-size: .72rem; font-weight: 700; }
.e-input { background: #fff; border: 1.5px solid var(--border); border-radius: 6px; padding: 7px 3px; text-align: center; font-family: var(--mono); font-size: .84rem; font-weight: 700; color: var(--text); width: 100%; outline: none; -moz-appearance: textfield; transition: border-color .15s, background .15s; }
.e-input::-webkit-inner-spin-button, .e-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.e-input:focus { border-color: var(--accent); background: var(--accent-light); }
.e-input.prev { background: var(--violet-light); border-color: #c0a0e8; color: var(--violet); }
.e-input.prev:focus { border-color: var(--violet); }
.e-input.loss:focus { border-color: var(--red); background: var(--red-light); }
.e-result { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 3px 4px; text-align: center; }
.e-result .rl { font-size: .48rem; color: var(--muted); font-family: var(--mono); margin-bottom: 2px; }
.e-result .rv { font-family: var(--mono); font-size: .78rem; font-weight: 700; line-height: 1.2; }
.e-result .rs { font-size: .52rem; margin-top: 2px; font-family: var(--mono); }

.c-violet { color: var(--violet); } .c-blue { color: var(--accent); } .c-amber { color: var(--amber); }
.c-red { color: var(--red); } .c-green { color: var(--green); } .c-muted { color: var(--muted); }

.reg-btn { background: var(--green); color: #fff; border: none; border-radius: 10px; font-size: .92rem; font-weight: 900; padding: 14px; cursor: pointer; width: 100%; font-family: var(--sans); letter-spacing: .04em; transition: opacity .15s; box-shadow: 0 3px 10px rgba(11,143,94,.3); }
.reg-btn:active { opacity: .8; }

.hist-area { display: flex; flex-direction: column; gap: 12px; }
.hist-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; animation: fadeUp .2s ease; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.hist-hd { background: var(--accent-light); padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.hist-lot { font-family: var(--mono); font-size: .82rem; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.hist-tot { font-family: var(--mono); font-size: .6rem; color: var(--muted); }
.h-thead { display: grid; padding: 5px 10px; background: var(--surface2); border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: .52rem; letter-spacing: .08em; color: var(--muted); text-align: center; }
.h-thead span:first-child { text-align: left; }
.h-row { display: grid; padding: 8px 10px; gap: 4px; border-bottom: 1px solid var(--border); align-items: center; }
.h-row:last-child { border-bottom: none; }
.h-row:nth-child(even) { background: var(--surface2); }
.h-cell { background: #fff; border: 1px solid var(--border); border-radius: 5px; padding: 4px 3px; text-align: center; font-family: var(--mono); font-size: .76rem; font-weight: 700; }
.h-cell .hl { font-size: .46rem; color: var(--muted); margin-bottom: 2px; }
.h-cell .hv { font-size: .76rem; font-weight: 700; line-height: 1.2; }
.carry-bar { padding: 7px 14px; font-family: var(--mono); font-size: .62rem; color: var(--violet); background: var(--violet-light); border-top: 1px solid var(--border); }
.carry-bar b { color: var(--text); }
.lot-info-bar { padding: 6px 14px; font-family: var(--mono); font-size: .6rem; color: var(--muted); background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; gap: 14px; flex-wrap: wrap; }
.lot-info-bar span { color: var(--text); font-weight: 700; }

/* 編集モーダル */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  z-index: 200; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-bg.hidden { display: none; }
.modal {
  background: var(--surface); border-radius: 14px; width: 100%; max-width: 420px;
  box-shadow: 0 8px 32px rgba(0,0,0,.2); overflow: hidden;
}
.modal-hd {
  background: var(--accent); color: #fff; padding: 12px 16px;
  font-weight: 700; font-size: .9rem; display: flex; justify-content: space-between; align-items: center;
}
.modal-close { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; line-height: 1; }
.modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.modal-field { display: flex; flex-direction: column; gap: 4px; }
.modal-field label { font-size: .68rem; color: var(--muted); font-family: var(--mono); font-weight: 700; letter-spacing: .06em; }
.modal-field input {
  background: var(--surface2); border: 1.5px solid var(--border); border-radius: 7px;
  padding: 9px 10px; font-family: var(--mono); font-size: .9rem; font-weight: 700;
  color: var(--text); outline: none; transition: border-color .15s; width: 100%;
  -moz-appearance: textfield;
}
.modal-field input::-webkit-inner-spin-button, .modal-field input::-webkit-outer-spin-button { -webkit-appearance: none; }
.modal-field input:focus { border-color: var(--accent); }
.modal-save {
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  padding: 12px; font-size: .9rem; font-weight: 900; cursor: pointer;
  font-family: var(--sans); transition: opacity .15s;
}
.modal-save:active { opacity: .8; }

/* 履歴の編集ボタン */
.edit-btn {
  font-family: var(--mono); font-size: .58rem; padding: 3px 8px;
  border: 1px solid var(--border2); border-radius: 5px;
  background: var(--surface); color: var(--muted); cursor: pointer;
  transition: border-color .15s, color .15s;
}
.edit-btn:hover { border-color: var(--accent); color: var(--accent); }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.bc0 { color: #0b8f5e; } .bc1 { color: #3355ff; } .bc2 { color: #b06000; } .bc3 { color: #7700cc; } .bc4 { color: #cc2200; }
.bd0 { background: #0b8f5e; } .bd1 { background: #3355ff; } .bd2 { background: #b06000; } .bd3 { background: #7700cc; } .bd4 { background: #cc2200; }

.sync-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); border-radius: 9px; padding: 10px 18px; font-family: var(--mono); font-size: .72rem; color: #fff; z-index: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.sync-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.sync-toast.ok { background: var(--green); } .sync-toast.err { background: var(--red); } .sync-toast.send { background: var(--accent); }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>瓶出し記録</h1>
    <div class="sub" id="headerSub">// 瓶種を選択して開始</div>
  </div>
  <div class="hdr-btns">
    <button class="hbtn" id="copyBtn" style="display:none" onclick="doExport()">COPY</button>
    <button class="hbtn" id="resetBtn" style="display:none" onclick="doReset()">RESET</button>
  </div>
</div>

<!-- SETUP -->
<div id="screen-setup">
  <div class="setup-note">// 使用する瓶をタップして選択。1pk本数は変更できます。</div>
  <div class="panel">
    <div class="panel-hd">// BOTTLE_SELECT</div>
    <div id="toggleList"></div>
    <div id="customList"></div>
  </div>
  <button class="add-custom-btn" onclick="addCustom()">+ CUSTOM BOTTLE を追加</button>

  <div class="panel">
    <div class="panel-hd">// 担当者名</div>
    <div class="gas-row">
      <input type="text" id="defaultNameInput" class="gas-input"
        placeholder="担当者名を入力（省略可）" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="panel">
    <div class="panel-hd">// PC連携（スプレッドシート送信先）</div>
    <div class="gas-row">
      <input type="text" id="gasUrlInput" class="gas-input" placeholder="GASのウェブアプリURLを貼り付け" autocomplete="off" spellcheck="false">
      <button class="gas-test" onclick="testGas()">接続確認</button>
    </div>
    <div class="gas-note" id="gasStatus">// URLを入れると登録ごとに自動でシートへ送信されます（空欄なら送信なし）</div>
  </div>
  <button class="start-btn" onclick="doStart()">▶ 記録を開始する</button>
</div>

<!-- MAIN -->
<div id="screen-main">
  <div class="lot-bar">
    <div class="lot-field">
      <div class="lot-lbl">PL No.</div>
      <input type="text" id="plNoInput" class="lot-input" placeholder="番号を入力" maxlength="20" autocomplete="off" spellcheck="false">
    </div>
    <div class="lot-divider"></div>
    <div class="lot-field">
      <div class="lot-lbl">瓶ロット</div>
      <div class="lot-prefix">NT-</div>
      <input type="text" id="bottleLotInput" class="lot-input" placeholder="番号を入力" maxlength="20" autocomplete="off" spellcheck="false">
    </div>
    <div class="lot-divider"></div>
    <div class="lot-field">
      <div class="lot-lbl">LOT No.</div>
      <input type="text" id="lotInput" class="lot-input" placeholder="番号を入力" maxlength="20" autocomplete="off" spellcheck="false">
    </div>
    <div class="lot-divider"></div>
    <div class="lot-divider"></div>
    <div class="lot-field">
      <div class="lot-lbl">担当者名</div>
      <input type="text" id="nameInput" class="lot-input" placeholder="担当者名" maxlength="20" autocomplete="off" spellcheck="false">
    </div>
    <div class="lot-divider"></div>
    <div class="lot-field memo-row">
      <div class="lot-lbl">備考</div>
      <input type="text" id="memoInput" class="memo-input" placeholder="メモを入力（任意）" maxlength="100" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="panel">
    <div class="panel-hd">// DATA_ENTRY</div>
    <div class="etable">
      <div class="e-head ecols7">
        <span>瓶種</span><span>前端数</span><span>出し本数</span><span>ロス</span><span>合計</span><span>PK数</span><span>後端数</span>
      </div>
      <div id="entryBody"></div>
    </div>
  </div>

  <button class="reg-btn" onclick="doRegister()">✔ このロットを登録</button>
  <div class="hist-area" id="historyArea"></div>
</div>

<!-- 編集モーダル -->
<div class="modal-bg hidden" id="editModal">
  <div class="modal">
    <div class="modal-hd">
      <span id="editModalTitle">記録を編集</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-field"><label>出し本数</label><input type="number" id="edit_qty" min="0" inputmode="numeric"></div>
      <div class="modal-field"><label>ロス</label><input type="number" id="edit_loss" min="0" inputmode="numeric"
        onfocus="if(this.value==='0')this.value=''"
        onblur="if(this.value==='')this.value='0'"></div>
      <div class="modal-field"><label>担当者名</label><input type="text" id="edit_name" maxlength="20" autocomplete="off"></div>
      <div class="modal-field"><label>備考</label><input type="text" id="edit_memo" maxlength="100" autocomplete="off"></div>
      <button class="modal-save" onclick="saveEdit()">保存する</button>
    </div>
  </div>
</div>

<div class="sync-toast" id="syncToast"></div>

<script>
const GAS_URL = '';
let gasUrl = GAS_URL;

const PRESETS = [
  { id:'p0', name:'5K瓶',  perPk:300 },
  { id:'p1', name:'9K瓶',  perPk:140 },
  { id:'p2', name:'13K瓶', perPk:80  },
];
const selected = new Set();

/* ── localStorage キー ── */
const LS_LOTS    = 'bottleLots';
const LS_CARRY   = 'bottleCarry';
const LS_BOTTLES = 'bottleBottles';
const LS_GAS     = 'bottleGasUrl';

function saveLots() {
  try { localStorage.setItem(LS_LOTS, JSON.stringify(lots)); } catch(e){}
}
function loadLots() {
  try { return JSON.parse(localStorage.getItem(LS_LOTS) || '[]'); } catch(e){ return []; }
}
function saveCarry() {
  try { localStorage.setItem(LS_CARRY, JSON.stringify(carry)); } catch(e){}
}
function loadCarry() {
  try { return JSON.parse(localStorage.getItem(LS_CARRY) || '{}'); } catch(e){ return {}; }
}
function saveBottles() {
  try { localStorage.setItem(LS_BOTTLES, JSON.stringify(BOTTLES)); } catch(e){}
}
function loadBottles() {
  try { return JSON.parse(localStorage.getItem(LS_BOTTLES) || 'null'); } catch(e){ return null; }
}

function buildToggle() {
  const list = document.getElementById('toggleList');
  list.innerHTML = '';
  PRESETS.forEach((p, i) => {
    const on = selected.has(p.id);
    const row = document.createElement('div');
    row.className = 'tog-item' + (on ? ' on' : '');
    row.dataset.id = p.id;
    row.innerHTML = `
      <div class="tog-box">${on ? '✓' : ''}</div>
      <div class="tog-info">
        <div class="tog-name bc${i}">${p.name}</div>

function calcRow(id) {
  const b = BOTTLES.find(x => x.id === id);
  if (!b) return;
  const prev = parseInt(document.getElementById('prev_'+id)?.value) || 0;
  const qty  = parseInt(document.getElementById('qty_' +id)?.value) || 0;
  const loss = parseInt(document.getElementById('loss_'+id)?.value) || 0;
  const net   = Math.max(0, qty - prev);
  let pk      = Math.floor(net / b.perPk);
  const post0 = net - (pk * b.perPk);   // ロス前の端数
  let postL   = post0 - loss;            // ロス後の端数
  let nextP, over = 0;

  if (loss > 0) {
    // ロスがある場合は端数のPKを1箱開けた扱い → +1pk
    pk = pk + 1;
  }

  if (postL < 0) {
    // 端数より多くロスが出た → さらに1pk追加
    pk    = pk + 1;
    nextP = b.perPk + postL;
    over  = -postL;
    postL = nextP;
  } else if (postL === 0) {
    nextP = 0;
  } else {
    nextP = postL;
  }

  const totalEl = document.getElementById('total_'+id);
  if (totalEl) {
    const v = totalEl.querySelector('.rv');
    v.textContent = (!qty && !prev) ? '—' : (qty + loss) + '本';
  }
  const pkEl = document.getElementById('pk_'+id);
  if (pkEl) pkEl.querySelector('.rv').textContent = pk + 'pk';
  const postEl = document.getElementById('post_'+id);
  if (postEl) {
    const v = postEl.querySelector('.rv');
    if (!qty && !prev) { v.textContent = '—'; v.className = 'rv c-amber'; }
    else {
      v.textContent = postL + '本';
      v.className = 'rv c-amber';
    }
  }
  const nxt = document.getElementById('nxt_'+id);
  if (nxt) {
    if (!qty && !prev) { nxt.textContent = ''; return; }
    if (nextP === 0)   { nxt.innerHTML = '<span class="c-green">ぴったり</span>'; }
    else               { nxt.innerHTML = `<span class="c-violet">次前端 ${nextP}本</span>`; }
  }
}

function showToast(msg, cls, ms) {
  const t = document.getElementById('syncToast');
  if (!t) return;
  t.textContent = msg; t.className = 'sync-toast show ' + (cls || '');
  if (ms !== 0) { clearTimeout(t._timer); t._timer = setTimeout(() => { t.className = 'sync-toast'; }, ms ?? 2200); }
}

function judgeText(r) {
  if (r.post === 0) return 'ぴったり';
  if (r.over > 0)   return '超過' + r.over + '本';
  return '次前端' + r.nextP + '本';
}

function sendToGas(plNo, bottleLot, lotNo, name, memo, rows, overwrite) {
  if (!gasUrl) return;
  const payload = {
    plNo, bottleLot, lotNo, name, memo,
    overwrite: !!overwrite,
    rows: rows.map(r => ({ name:r.b.name, prev:r.prev, qty:r.qty, loss:r.loss, pk:r.pk, post:r.post, nextP:r.nextP, judge:judgeText(r) }))
  };
  showToast(overwrite ? '▸ シートを上書き中…' : '▸ シートへ送信中…', 'send', 0);
  fetch(gasUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) })
    .then(r => r.json())
    .then(res => { showToast(res&&res.ok ? (overwrite ? '✔ シートを上書きしました' : '✔ シートに保存しました（'+res.written+'件）') : '✕ 送信エラー：COPYで控えを', res&&res.ok?'ok':'err', res&&res.ok?2200:3500); })
    .catch(() => showToast('✕ 送信失敗：通信を確認、COPYで控えを', 'err', 3500));
}

function doRegister() {
  const plNo      = document.getElementById('plNoInput').value.trim();

  const rows = BOTTLES.map(b => {

    const qty  = parseInt(document.getElementById('qty_' +b.id)?.value) || 0;
    const loss = parseInt(document.getElementById('loss_'+b.id)?.value) || 0;
    const net    = Math.max(0, qty - prev);
    let pk       = Math.floor(net / b.perPk);
    const post0  = net - (pk * b.perPk);
    let postL    = post0 - loss;
    let nextP, over = 0;
    if (loss > 0) { pk = pk + 1; }
    if (postL < 0) {
      pk    = pk + 1;
      nextP = b.perPk + postL;
      over  = -postL;
      postL = nextP;
    } else if (postL === 0) {
      nextP = 0;
    } else {
      nextP = postL;
    }
    return { b, prev, qty, loss, pk, post: postL, nextP, over };
  });

  rows.forEach(r => { carry[r.b.id] = r.nextP; });
  const lotEntry = { plNo, bottleLot, lotNo, name, memo, rows, carry: { ...carry } };

/* ── 編集モーダル ── */
let editLotIdx = -1;
let editRowIdx = -1;

function openEditModal(lotIdx) {
  editLotIdx = lotIdx;
  const lot = lots[lotIdx];
  if (!lot) return;

  // 瓶が1つなら直接、複数なら最初の瓶を対象（シンプルな実装）
  editRowIdx = 0;

  document.getElementById('editModalTitle').textContent = `LOT_${lot.lotNo} を編集`;
  document.getElementById('edit_qty').value  = lot.rows[0]?.qty  ?? '';
  document.getElementById('edit_loss').value = lot.rows[0]?.loss ?? 0;
  document.getElementById('edit_name').value = lot.name || '';
  document.getElementById('edit_memo').value = lot.memo || '';
  document.getElementById('editModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('editModal').classList.add('hidden');
}

function saveEdit() {
  const lot = lots[editLotIdx];
  if (!lot) return;

  const newQty  = parseInt(document.getElementById('edit_qty').value)  || 0;
  const newLoss = parseInt(document.getElementById('edit_loss').value) || 0;
  const newName = document.getElementById('edit_name').value.trim();
  const newMemo = document.getElementById('edit_memo').value.trim();

  // 編集対象行を再計算
  const r = lot.rows[editRowIdx];
  const b = r.b;
  r.qty  = newQty;
  r.loss = newLoss;
  const net    = Math.max(0, newQty - r.prev);
  let pk       = Math.floor(net / b.perPk);
  const post0  = net - pk * b.perPk;
  let postL    = post0 - newLoss;
  let nextP, over = 0;
  if (newLoss > 0) { pk = pk + 1; }
  if (postL < 0) {
    pk    = pk + 1;
    nextP = b.perPk + postL;
    over  = -postL;
    postL = nextP;
  } else if (postL === 0) {
    nextP = 0;
  } else {
    nextP = postL;
  }
  r.pk = pk; r.post = postL; r.nextP = nextP; r.over = over;
  lot.name = newName;
  lot.memo = newMemo;

  // このロットのcarryを再計算
  lot.rows.forEach(row => { lot.carry[row.b.id] = row.nextP; });

  // 以降のロットの前端数を連鎖更新
  for (let i = editLotIdx + 1; i < lots.length; i++) {
    const prevLot = lots[i - 1];
    const curLot  = lots[i];
    curLot.rows.forEach(row => {
      const prevNextP = prevLot.carry[row.b.id];
      if (prevNextP == null) return;
      row.prev = prevNextP;
      const n      = Math.max(0, row.qty - row.prev);
      let pk2      = Math.floor(n / row.b.perPk);
      const post0  = n - pk2 * row.b.perPk;
      let postL2   = post0 - row.loss;
      let nextP2, over2 = 0;
      if (row.loss > 0) { pk2 = pk2 + 1; }
      if (postL2 < 0) {
        pk2    = pk2 + 1;
        nextP2 = row.b.perPk + postL2;
        over2  = -postL2;
        postL2 = nextP2;
      } else if (postL2 === 0) {
        nextP2 = 0;
      } else {
        nextP2 = postL2;
      }
      row.pk = pk2; row.post = postL2; row.nextP = nextP2; row.over = over2;
      curLot.carry[row.b.id] = nextP2;
    });
  }

  // 入力欄の前端数も最新ロットに合わせて更新
  if (lots.length > 0) {
    const lastLot = lots[lots.length - 1];
    BOTTLES.forEach(bt => { carry[bt.id] = lastLot.carry[bt.id] ?? 0; });
    saveCarry();
    refreshPrev();
  }

  saveLots();
  closeModal();

  // 編集したロット以降の履歴カードをすべて再描画
  const area  = document.getElementById('historyArea');
  const cards = Array.from(document.querySelectorAll('.hist-card'));
  cards.forEach(card => {
    const idx = parseInt(card.dataset.lotIdx);
    if (idx >= editLotIdx) {
      const l = lots[idx];
      if (!l) return;
      const newCard = document.createElement('div');
      newCard.className = 'hist-card';
      area.replaceChild(newCard, card);
      addHistCardInPlace(newCard, l.plNo, l.bottleLot, l.lotNo, l.name || '', l.memo, l.rows, l.carry);
    }
  });
  // 編集したロット以降をすべてGASに上書き送信
  for (let i = editLotIdx; i < lots.length; i++) {
    const l = lots[i];
    sendToGas(l.plNo, l.bottleLot, l.lotNo, l.name || '', l.memo || '', l.rows, true);
  }
  showToast('✔ 編集しました（前端数・シートを更新しました）', 'ok');
}

  const totalQty = rows.reduce((s,r) => s+r.qty, 0);

        <div class="h-cell"><div class="hl">合計</div><span class="c-amber">${(r.qty+r.loss).toLocaleString()}本</span></div>
        <div class="h-cell"><div class="hl">PK数</div><span class="c-blue">${r.pk.toLocaleString()}pk</span></div>
        <div class="h-cell">
          <div class="hl">後端数</div>
          <span style="color:${postColor}">${r.post.toLocaleString()}本</span>
          <div style="margin-top:3px;font-size:.52rem">${nextStr}</div>
        </div>
      </div>`;
  }).join('');

  card.innerHTML = `
    <div class="hist-hd">
      <span class="hist-lot">LOT_${lotNo}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span class="hist-tot">${totalQty.toLocaleString()}本 / ${totalPk.toLocaleString()}pk</span>
        <button class="edit-btn" onclick="openEditModal(${lotIdx})">編集</button>
      </span>
    </div>
    <div class="lot-info-bar">
      ${plNo ? `PL No.：<span>${plNo}</span>` : ''}
      ${bottleLot !== 'NT-' ? `瓶ロット：<span>${bottleLot}</span>` : ''}
      ${name ? `担当者：<span>${name}</span>` : ''}
      ${memo ? `備考：<span>${memo}</span>` : ''}
    </div>
    <div class="h-thead ecols7">
      <span>瓶種</span><span>前端数</span><span>出し本数</span><span>ロス</span><span>合計</span><span>PK数</span><span>後端数</span>
    </div>
    ${rowsHtml}
    <div class="carry-bar">▸ 次ロット前端数：${BOTTLES.map(b=>`${b.name} <b>${carrySnap[b.id]!=null?carrySnap[b.id].toLocaleString():0}本</b>`).join('　')}</div>`;
}

function doExport() {
  if (!lots.length) { alert('記録がありません'); return; }
  const lines = ['=== 瓶出し記録 ==='];
  [...lots].reverse().forEach(l => {
    lines.push(`\n【LOT ${l.lotNo}】`);
    if (l.plNo) lines.push(`  PL No.: ${l.plNo}`);
    if (l.bottleLot !== 'NT-') lines.push(`  瓶ロット: ${l.bottleLot}`);
    if (l.memo) lines.push(`  備考: ${l.memo}`);
    l.rows.forEach(r => {
      lines.push(`  ${r.b.name}: 前端数${r.prev}本 + ${r.qty}本 → ${r.pk}pk　後端数${r.post}本（次前端数${r.nextP}本）${r.loss>0?' ロス'+r.loss+'本':''}`);
    });
    lines.push(`  次ロット前端数: ${BOTTLES.map(b=>`${b.name}${l.carry[b.id]}本`).join(' / ')}`);
  });
  navigator.clipboard.writeText(lines.join('\n'))
    .then(() => alert('コピーしました！'))
    .catch(() => alert('コピーに失敗しました'));
}

function doReset() {
  if (!confirm('全記録をリセットしてセットアップに戻りますか？')) return;
  lots = []; carry = {};
  localStorage.removeItem(LS_LOTS);
  localStorage.removeItem(LS_CARRY);
  localStorage.removeItem(LS_BOTTLES);
  document.getElementById('historyArea').innerHTML = '';
  document.getElementById('entryBody').innerHTML   = '';
  document.getElementById('screen-main').style.display  = 'none';
  document.getElementById('screen-setup').style.display = 'flex';
  document.getElementById('copyBtn').style.display  = 'none';
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('headerSub').textContent  = '// 瓶種を選択して開始';
  document.getElementById('customList').innerHTML   = '';
  buildToggle();
}
</script>
</body>
</html>
